<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1060" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="800" height="1060" fill="#ffffff"/>

  <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Full-Stack Architecture: Library Management System</text>
  <text x="400" y="68" text-anchor="middle" font-size="14" fill="#64748b">React/HTML frontend · Node + Express backend · MySQL database</text>

  <!-- CLIENT -->
  <rect x="300" y="95" width="200" height="50" rx="25" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="400" y="127" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">CLIENT / USER</text>
  <line x1="400" y1="145" x2="400" y2="180" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- FRONTEND -->
  <rect x="200" y="185" width="400" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="400" y="218" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">FRONTEND</text>
  <text x="400" y="244" text-anchor="middle" font-size="15" fill="#1e3a8a">HTML / CSS / JavaScript or React</text>
  <text x="400" y="264" text-anchor="middle" font-size="13" fill="#475569">fetch("/api/books")</text>

  <line x1="400" y1="280" x2="400" y2="335" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="320" y="296" width="160" height="26" rx="13" fill="#fff" stroke="#94a3b8"/>
  <text x="400" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">HTTP / HTTPS (JSON)</text>

  <!-- BACKEND container -->
  <rect x="120" y="340" width="560" height="400" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="400" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">BACKEND · Node.js + Express.js</text>

  <rect x="220" y="392" width="360" height="75" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Routes</text>
  <text x="400" y="445" text-anchor="middle" font-size="13" fill="#475569">/api/students · /api/books · /api/transactions</text>
  <line x1="400" y1="467" x2="400" y2="497" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="220" y="500" width="360" height="75" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="528" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Middleware</text>
  <text x="400" y="553" text-anchor="middle" font-size="13" fill="#475569">Authentication · Validation · Error handling</text>
  <line x1="400" y1="575" x2="400" y2="605" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="220" y="608" width="360" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="636" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Business Logic (Controllers)</text>
  <text x="400" y="661" text-anchor="middle" font-size="13" fill="#475569">studentController · bookController</text>
  <text x="400" y="683" text-anchor="middle" font-size="13" fill="#475569">issue / return book rules</text>

  <line x1="400" y1="740" x2="400" y2="800" stroke="#334155" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="355" y="758" width="90" height="26" rx="13" fill="#fff" stroke="#94a3b8"/>
  <text x="400" y="776" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">SQL</text>

  <!-- DATABASE -->
  <rect x="120" y="805" width="560" height="215" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="400" y="838" text-anchor="middle" font-size="20" font-weight="700" fill="#7c2d12">DATABASE · MySQL</text>

  <g font-size="14" font-weight="700" text-anchor="middle" fill="#7c2d12">
    <rect x="145" y="858" width="120" height="70" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="205" y="885">users</text>
    <text x="205" y="906" font-size="11" font-weight="400" fill="#475569">id, name, email,</text>
    <text x="205" y="920" font-size="11" font-weight="400" fill="#475569">password, role</text>

    <rect x="285" y="858" width="120" height="70" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="345" y="885">students</text>
    <text x="345" y="906" font-size="11" font-weight="400" fill="#475569">id, name, course,</text>
    <text x="345" y="920" font-size="11" font-weight="400" fill="#475569">email</text>

    <rect x="425" y="858" width="120" height="70" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="485" y="885">books</text>
    <text x="485" y="906" font-size="11" font-weight="400" fill="#475569">id, title, author,</text>
    <text x="485" y="920" font-size="11" font-weight="400" fill="#475569">quantity</text>

    <rect x="565" y="858" width="100" height="70" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="615" y="885">transactions</text>
    <text x="615" y="906" font-size="11" font-weight="400" fill="#475569">student_id, book_id,</text>
    <text x="615" y="920" font-size="11" font-weight="400" fill="#475569">dates, status</text>
  </g>

  <text x="400" y="965" text-anchor="middle" font-size="13" fill="#7c2d12">Student 1 ── Many Transactions Many ── 1 Book</text>
  <text x="400" y="990" text-anchor="middle" font-size="13" fill="#7c2d12">Response returns as JSON ↑ to the frontend</text>
</svg>
